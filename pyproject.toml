[tool.poetry]
name = "glpwnme"
version = "0.4.6"
description = "Tool to exploit non up-to-date GLPI"
authors = ["Guilhem Rioux <guilhem.rioux@orangecyberdefense.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
beautifulsoup4 = ">=4.12,<5.0"
packaging = ">=24.2,<27.0"
pygments = ">=2.17,<3.0"
pynacl = ">=1.5.0,<2.0"
requests = ">=2.32,<3.0"
rich = ">=13.7,<15.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
glpwnme = "glpwnme:run_cli"
